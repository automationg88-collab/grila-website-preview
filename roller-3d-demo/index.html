<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRILA | 3D Roller Blind</title><style>*{box-sizing:border-box}body{margin:0;background:#141516;color:#f3eee6;font:15px system-ui}header{position:absolute;top:20px;left:24px;z-index:2}h1{font-size:20px;margin:0}small{color:#b8afa4}canvas{display:block}aside{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:#22262be8;border:1px solid #555;padding:14px;border-radius:16px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(96%,690px)}button{background:#b89a78;border:0;padding:10px 13px;border-radius:9px;color:#151515;font-weight:700}input{flex:1;min-width:130px}#status{font-size:12px;color:#ddd}@media(max-width:500px){header{top:12px;left:12px}aside{bottom:8px;padding:10px}}</style></head><body><header><h1>GRILA / ROLLER SYSTEM</h1><small>3D component reveal · concept model · tube Ø30 mm</small></header><aside><button id="play">Play</button><button id="pause">Pause</button><button id="assemble">Assemble</button><button id="reset">Reset camera</button><input id="progress" type="range" min="0" max="100" value="0" aria-label="Explosion progress"><span id="status">0%</span></aside><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x17191b);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.01,100);camera.position.set(1.8,1.05,2.75);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,-.36,0);orbit.minDistance=1;orbit.maxDistance=6;orbit.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x58473a,2));const key=new THREE.DirectionalLight(0xffe5ca,3);key.position.set(-2,4,5);scene.add(key);const rim=new THREE.DirectionalLight(0xffffff,2);rim.position.set(2,2,-3);scene.add(rim);
const metal=new THREE.MeshStandardMaterial({color:0x9c948d,metalness:.75,roughness:.28});const dark=new THREE.MeshStandardMaterial({color:0x32231b,metalness:.3,roughness:.4});const cloth=new THREE.MeshStandardMaterial({color:0x9a7b62,roughness:.96,side:THREE.DoubleSide});
const groups={tube:new THREE.Group(),fabric:new THREE.Group(),rail:new THREE.Group(),left:new THREE.Group(),right:new THREE.Group()};Object.values(groups).forEach(g=>scene.add(g));
function add(g,geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m}
const width=1.35, radius=.015;const tube=add(groups.tube,new THREE.CylinderGeometry(radius,radius,width,40),metal);tube.rotation.z=Math.PI/2;
const fabric=add(groups.fabric,new THREE.PlaneGeometry(width-.045,1.16,1,36),cloth,0,-.60,.016);fabric.rotation.y=0;
const texture=document.createElement('canvas');texture.width=128;texture.height=128;const ctx=texture.getContext('2d');ctx.fillStyle='#9b7b60';ctx.fillRect(0,0,128,128);for(let i=0;i<128;i+=3){ctx.fillStyle=i%2?'#b39273':'#785d4b';ctx.fillRect(0,i,128,1)}for(let i=0;i<128;i+=5){ctx.fillStyle='#b09379';ctx.fillRect(i,0,1,128)}const tex=new THREE.CanvasTexture(texture);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(6,7);cloth.map=tex;cloth.needsUpdate=true;
add(groups.rail,new THREE.BoxGeometry(width,.037,.042),dark,0,-1.19,.02);add(groups.rail,new THREE.BoxGeometry(width-.03,.007,.045),metal,0,-1.211,.02);
for(const [side,sign] of [['left',-1],['right',1]]){add(groups[side],new THREE.CylinderGeometry(.022,.022,.018,32),dark,sign*(width/2+.01),0,0).rotation.z=Math.PI/2;add(groups[side],new THREE.BoxGeometry(.035,.075,.07),metal,sign*(width/2+.045),.015,0)}
const assembled=Object.fromEntries(Object.entries(groups).map(([k,g])=>[k,g.position.clone()]));const offsets={tube:[0,.26,-.18],fabric:[0,-.13,.38],rail:[0,-.4,.20],left:[-.45,.12,0],right:[.45,.12,0]};
let p=0,playing=false,reverse=false,last=performance.now();const slider=document.getElementById('progress'),status=document.getElementById('status');
function setProgress(v){p=Math.max(0,Math.min(1,v));for(const [k,g] of Object.entries(groups)){const o=offsets[k];g.position.copy(assembled[k]).add(new THREE.Vector3(o[0],o[1],o[2]).multiplyScalar(p))}slider.value=Math.round(p*100);status.textContent=Math.round(p*100)+'%'}
document.getElementById('play').onclick=()=>{reverse=false;playing=true;if(p>=1)setProgress(0)};document.getElementById('pause').onclick=()=>playing=false;document.getElementById('assemble').onclick=()=>{reverse=true;playing=true};document.getElementById('reset').onclick=()=>{camera.position.set(1.8,1.05,2.75);orbit.target.set(0,-.36,0);orbit.update()};slider.oninput=e=>{playing=false;setProgress(Number(e.target.value)/100)};
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;if(playing){setProgress(p+(reverse?-1:1)*dt/2.3);if(p===0||p===1)playing=false}orbit.update();renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setProgress(0);
</script></body></html>
