name: Homepage browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/homepage.spec.js'
      - 'playwright.config.js'
      - '.github/workflows/visual-qa.yml'
  workflow_run:
    workflows: ["Deploy Grila preview to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: homepage-browser-qa
  cancel-in-progress: false

jobs:
  browser-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test

      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Start local static server for pull-request tests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory . >/tmp/grila-homepage-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/grila-homepage-server.log
          exit 1

      - name: Test proposed homepage locally
        if: github.event_name == 'pull_request'
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/homepage.spec.js

      - name: Test deployed homepage
        if: github.event_name != 'pull_request'
        env:
          BASE_URL: https://automationg88-collab.github.io/grila-website-preview
        run: npx playwright test tests/homepage.spec.js

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grila-homepage-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
