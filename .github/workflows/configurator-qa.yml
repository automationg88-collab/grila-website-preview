name: Configurator browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'configurator.html'
      - 'tests/**'
      - 'playwright.config.js'
      - '.github/workflows/configurator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run configurator browser tests
        run: npx playwright test
      - name: Upload browser screenshots and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configurator-qa-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
